<!doctype html>
<notebook theme="midnight">
  <title>Treading the Void</title>
  <script id="2" type="text/markdown" hidden="">
    # Treading the Void
  </script>
  <script id="1" type="text/html">
    <style>
      /* the defaults in custom.tmpl */
    </style>
    <div id="frame">
      <img id="calligraphy" class="zi" alt="">
      <div id="field"></div>
    </div>
    <div id="byline">
      <span id="bytext"><cite>Treading the Void</cite> by Liu Yuxi (772-842), 2nd part, translated by John for 2024/25.<br>Contemporary calligraphy from the book <cite>Tangshi Shufa</cite>.</span>
    </div>
  </script>
  <script id="3" type="module">
    // Wait for the DOM to be ready before querying elements
    await new Promise(resolve => requestAnimationFrame(resolve));

    const { config } = await import("./data/treading-void/config.js");
    // --- DEBUG configuration
    // config.startingPoint = 1; // DEBUG: start at a later paragraph
    // config.running = false; // DEBUG
    const fieldElem = document.getElementById("field");
    document.getElementById("frame").style.fontWeight = config.fontWeight;
    document.getElementById("calligraphy").src = await FileAttachment("./data/treading-void/tssf_181_2024.jpg").url();
    // --- preprocessing ---
    const spels = new Map(await FileAttachment("./data/treading-void/spels.json").json());
    fieldElem.innerHTML = Array.from(spels.values())
      .map((spel) => spel.html)
      .join("");
    const paras = await FileAttachment("./data/treading-void/paras.json").json();
    // scores are in milliseconds (converted from the Framework originals' hundredths of a second)
    const scores = await FileAttachment("./data/treading-void/scores.json").json();

    const { play, splitIntoChars } = await import("scoringthespeltair");
    if (config.charFades) splitIntoChars(fieldElem);
    if (config.running) play(config, fieldElem, spels, paras, scores);
  </script>
</notebook>
